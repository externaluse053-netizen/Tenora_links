<style>
:root{
  --bg:#F7F2EC;
  --card:#FBF8F3;
  --ink:#2D2A26;
  --sage:#8DA48F;
  --sage-dark:#5F7A63;
  --taupe:#A89B8A;
  --muted:#7C746A;
  --line:#E6DDD0;
  --sans:"Poppins",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0}
html{background:var(--bg)}
body{
  min-height:100vh;position:relative;overflow-x:hidden;
  font-family:var(--sans);color:var(--ink);background:var(--bg);
  display:flex;justify-content:center;
  padding:max(28px,env(safe-area-inset-top)) 20px max(40px,env(safe-area-inset-bottom));
}
.leaf{position:fixed;width:150px;height:auto;opacity:.55;pointer-events:none;z-index:0}
.leaf.l{left:-28px;bottom:-10px;transform:rotate(-8deg)}
.leaf.r{right:-28px;bottom:-10px;transform:scaleX(-1) rotate(-8deg)}
main{position:relative;z-index:1;width:100%;max-width:440px;text-align:center}

.logo{display:block;width:min(100%,400px);height:auto;margin:0 auto 26px}


ul{list-style:none;padding:0;display:grid;gap:12px}
a.link{
  display:flex;align-items:center;gap:14px;
  padding:15px 18px;
  background:var(--card);border:1px solid var(--line);border-radius:12px;
  color:var(--ink);text-decoration:none;text-align:left;
  transition:border-color .2s,transform .2s,background .2s;
}
a.link:hover{border-color:var(--sage);transform:translateY(-2px)}
a.link:focus-visible{outline:3px solid var(--sage-dark);outline-offset:3px}
a.link svg{flex:none;width:24px;height:24px;fill:none;stroke:var(--sage-dark);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
a.link b{display:block;font-weight:500;font-size:15px}
a.link small{display:block;margin-top:1px;font-size:12.5px;font-weight:300;color:var(--muted)}
a.link i{margin-left:auto;font-style:normal;color:var(--taupe);font-size:20px}

a.link.primary{background:var(--sage-dark);border-color:var(--sage-dark);color:#fff}
a.link.primary:hover{background:#4E6752;border-color:#4E6752}
a.link.primary svg{stroke:#fff}
a.link.primary small{color:#E1EAE2}
a.link.primary i{color:#fff}

footer{margin-top:34px;font-size:12px;font-weight:300;color:var(--taupe);letter-spacing:.04em}
footer p+p{margin-top:4px}

@media (prefers-reduced-motion:reduce){a.link{transition:none}a.link:hover{transform:none}}
@media (max-width:480px){.leaf{width:110px}}
</style>
</head>
